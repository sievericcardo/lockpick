name: Release

# Build and publish release binaries when a version tag (e.g. v1.0.0) is pushed.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  release:
    name: Build and publish release
    # Use the oldest supported Ubuntu runner so the resulting glibc-linked
    # binaries run on more distributions.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            clang \
            libclang-dev \
            pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release

      - name: Run test suite
        run: cargo test --workspace --release --locked

      - name: Build release binaries
        run: cargo build --release --locked --bin lockpick --bin lockpick-lsp

      - name: Package release artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          version="${GITHUB_REF_NAME//\//-}"
          archive="lockpick-${version}-x86_64-unknown-linux-gnu.tar.gz"
          tar -czf "dist/${archive}" -C target/release lockpick lockpick-lsp
          (cd dist && sha256sum "${archive}" > "${archive}.sha256")

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lockpick-linux-x86_64
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
